version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - catalyst-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - catalyst-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - catalyst-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - catalyst-network

networks:
  catalyst-network:
    driver: bridge
